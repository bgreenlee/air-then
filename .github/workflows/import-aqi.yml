name: Refresh AQI data

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "First AirNow date to import (YYYY-MM-DD; blank = yesterday)"
        required: false
        type: string
      end_date:
        description: "Last AirNow date to import (YYYY-MM-DD; blank = start date)"
        required: false
        type: string
      load_reference_data:
        description: "Refresh Census places and CBSA boundaries"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aqi-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r importer/requirements.txt
      - name: Upsert AirNow daily monitor observations
        run: |
          START_DATE="${{ inputs.start_date }}"
          END_DATE="${{ inputs.end_date }}"
          START_DATE="${START_DATE:-$(date -u -d yesterday +%F)}"
          END_DATE="${END_DATE:-$START_DATE}"
          if [[ "$START_DATE" > "$END_DATE" ]]; then echo "start_date must not exceed end_date"; exit 1; fi
          python importer/import_airnow.py --start-date "$START_DATE" --end-date "$END_DATE"
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Load Census search geography
        if: ${{ inputs.load_reference_data }}
        run: python importer/import_reference.py --year 2025 --with-cbsa-boundaries
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
