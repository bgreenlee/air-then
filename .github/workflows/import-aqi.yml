name: Refresh EPA AQI

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      start_year:
        description: "First EPA calendar year to import (blank = current year)"
        required: false
        type: string
      end_year:
        description: "Last EPA calendar year to import (blank = start year)"
        required: false
        type: string
      load_reference_data:
        description: "Also load Census ZIP and CBSA centroids (run once first)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aqi-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r importer/requirements.txt
      - name: Upsert EPA AQI year range
        run: |
          START_YEAR="${{ inputs.start_year }}"
          END_YEAR="${{ inputs.end_year }}"
          START_YEAR="${START_YEAR:-$(date -u +%Y)}"
          END_YEAR="${END_YEAR:-$START_YEAR}"
          if [ "$START_YEAR" -gt "$END_YEAR" ]; then echo "start_year must not exceed end_year"; exit 1; fi
          for YEAR in $(seq "$START_YEAR" "$END_YEAR"); do
            echo "Importing $YEAR"
            python importer/import_aqi.py --kind cbsa --year "$YEAR"
            python importer/import_aqi.py --kind county --year "$YEAR"
          done
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Load Census reference geography
        if: ${{ inputs.load_reference_data }}
        run: python importer/import_reference.py --year 2025
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
